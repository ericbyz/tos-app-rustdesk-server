# TOS platform nginx include — maps the /rustdesk-server/ route to the local panel port.
# Location-block only (server{} is forbidden by the TOS spec, guide ch. 8.3.2.2).
# proxy_pass HAS a trailing slash on purpose: the /rustdesk-server prefix is stripped,
# because RustDesk Server's panel uses fully relative asset/API paths and serves at "/".
# (Floating-window iframe mode, config.ini: type=iframe, path=/rustdesk-server/, exec=false)
location /rustdesk-server/ {
    proxy_pass http://127.0.0.1:21116/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 16m;
}
